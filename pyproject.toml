[project]
name = "nore-voice-platform"
version = "1.0.0"
description = "NORE - Production Real-Time Voice Intelligence Platform with Secure ElevenLabs Integration, RBAC, WebSockets, and Admin Dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
